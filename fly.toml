# fly.toml app configuration file generated for ticker-dash on 2026-08-29T23:34:53-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ticker-dash'
primary_region = 'ewr'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
[deploy]
  strategy = 'immediate'

[env]
  DB_PATH = '/data/ticker.db'
  PORT = '8080'

[[mounts]]
  source = 'ticker_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
